apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.27.3        # Keep version consistent
    chart: gateway                # <-- The standalone gateway chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system       # Deploying into the same namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true