apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: "https://istio-release.storage.googleapis.com/charts"
    targetRevision: 1.27.3
    chart: gateway
    helm:
      values: |
        service:
          type: NodePort
          ports:
            - name: status-port
              port: 15021
              targetPort: 15021
              nodePort: 32021

            - name: http2
              port: 80
              targetPort: 8080
              nodePort: 30080

            - name: https
              port: 443
              targetPort: 8443
              nodePort: 30443
  destination:
    server: "https://kubernetes.default.svc"
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
