apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─────────────────────────────────────────────
# Bitnami Redis via Helm in Kustomize
# ─────────────────────────────────────────────
helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: "19.6.4"
    releaseName: redis
    namespace: redis
    valuesInline:
      architecture: standalone
      image:
        registry: public.ecr.aws
        repository: bitnami/redis
        tag: 7.2.5-debian-12-r4
      master:
        livenessProbe:
          enabled: true
          initialDelaySeconds: 60 # give Redis more time to start
          periodSeconds: 30 # check less frequently
          timeoutSeconds: 10 # was 5, give script more time
          failureThreshold: 10 # be more tolerant of failures
          successThreshold: 1
        readinessProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 10
          successThreshold: 1

# Patch the secret password for production
# In real setups, use Sealed Secrets or External Secrets Operator instead
patches:
  - patch: |-
      - op: replace
        path: /stringData/redis-password
        value: "12345"
    target:
      kind: Secret
      name: redis-secret
