apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─────────────────────────────────────────────
# Bitnami Redis via Helm in Kustomize
# ─────────────────────────────────────────────
helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: "19.6.4"
    releaseName: redis
    namespace: redis
    # valuesFile: values.yaml
 
# Patch the secret password for production
# In real setups, use Sealed Secrets or External Secrets Operator instead
patches:
  - patch: |-
      - op: replace
        path: /stringData/redis-password
        value: "12345"
    target:
      kind: Secret
      name: redis-secret
 