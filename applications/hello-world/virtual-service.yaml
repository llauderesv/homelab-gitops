apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hello-world
spec:
  hosts:
    - host.minikube.internal
  gateways:
    - istio-system/homelab-gateway
  http:
    - match:
        - uri:
            regex: '^/hello-world(/.*)?$'
      rewrite:
        uri: /
      route:
        - destination:
            host: hello-world-service
            port:
              number: 3000
          weight: 100
